<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Сторінку не знайдено — Меблі від виробника</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
main{min-height:100vh;display:grid;place-items:center;padding:40px 20px;text-align:center}
main>div{display:grid;gap:20px;justify-items:center}
.code{font-family:var(--f-display);font-weight:700;font-size:clamp(96px,22vw,200px);line-height:1;color:var(--red)}
</style>
</head>
<body>
<main><div>
  <span class="code">404</span>
  <h1 style="font-size:clamp(28px,4vw,44px)">Такої сторінки немає</h1>
  <p class="lead">Можливо, адресу введено з помилкою або сторінку перенесли. Каталог і контакти є на головній.</p>
  <a class="btn btn-primary" href="/" style="padding-right:26px">На головну</a>
</div></main>
</body>
</html>
